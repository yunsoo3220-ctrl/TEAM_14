# SKU 스터디 커뮤니티 서버 설정

# MySQL
DB_HOST=127.0.0.1
DB_PORT=3306
DB_USER=root
DB_PASS=1234
DB_NAME=sku_study

# 웹 서버 (같은 와이파이의 다른 기기에서도 접속하려면 BIND_ADDR=0.0.0.0)
BIND_ADDR=127.0.0.1
SERVER_PORT=8080

# n8n (railway) 웹훅 - sku_sdk_14.json 워크플로의 "Webhook (스터디 확정)" 노드
# 예) N8N_WEBHOOK_URL=https://xxxx.up.railway.app/webhook/study-confirmed
# 비워 두면 스터디 확정은 되지만 메일은 발송되지 않습니다.
N8N_WEBHOOK_URL=https://n8n-production-59af5.up.railway.app/webhook/study-confirmed
# n8n "Header Auth account" 자격 증명의 Name / Value 와 같게 입력
N8N_AUTH_NAME=SKU-14-KEY
N8N_AUTH_VALUE=JMiL8-NAlqOxEa64e8JIXKxjOKiLQMHMkAPwFL1O1Oo

# Claude API - 프로필 성향 일치도(%) AI 분석
# 비워 두면 관심 키워드 일치도 계산으로만 표시합니다.
# 키 발급: https://platform.claude.com (API Keys)
CLAUDE_API_KEY=
CLAUDE_MODEL=claude-opus-5-5

# 도서 거래 - 책 사진의 ISBN 바코드(OpenCV)로 책 이름·저자·출판사·정가 조회 (카카오 책 검색 API)
